plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Sodium, for its settings API (below), from Modrinth's Maven.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

sourceSets {
	// The experimental parts: the shader pack loader, upscaling and far terrain, as a mod of its own (afterburner_labs)
	// that plugs into Afterburner. The released jar carries it inside (see jar below), and the dev client loads it.
	labs
	// The benchmark and check commands used while developing (afterburner_bench). Also only in the dev client.
	bench
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/afterburner.accesswidener")

	mods {
		"afterburner" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"afterburner_labs" {
			sourceSet sourceSets.labs
		}
		"afterburner_bench" {
			sourceSet sourceSets.bench
		}
	}

	runs {
		server {
			server()
			configName = "Dev Server"
			runDir "run-server"
			programArgs "--nogui"
		}
		portClient {
			client()
			configName = "Port Client"
			runDir "run-plain"
		}
		compatClient {
			client()
			configName = "Compat Client"
			runDir "run-compat"
			source sourceSets.labs
		}
		client {
			// The dev client loads the labs and the bench tools too (the labs' classpath has both).
			source sourceSets.labs
			// For benchmark runs, e.g. -PclientVmArgs="-Dafterburner.disable=true" -PclientArgs="--quickPlaySingleplayer bench"
			if (project.hasProperty('clientVmArgs')) vmArgs(*project.property('clientVmArgs').toString().split(' '))
			if (project.hasProperty('clientArgs')) programArgs(*project.property('clientArgs').toString().split(' '))
		}
	}
}

sourceSets.bench {
	compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
	runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
}

// The labs' far land check (/afterburner-farland) uses the bench's chunk loading and reports.
sourceSets.labs {
	compileClasspath += sourceSets.bench.compileClasspath + sourceSets.bench.output
	runtimeClasspath += sourceSets.bench.runtimeClasspath
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. Only the modules Afterburner uses: the full fabric-api jar trips Loom's dependency
	// remapper (fabric-convention-tags-v2 and fabric-tag-api-v1 both carry the same package-info class).
	modImplementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:2.6.0+0865547519"
	modImplementation "net.fabricmc.fabric-api:fabric-command-api-v2:2.2.28+6ced4dd919"

	// Mixin and its companions. The 26.3 toolchain provided these implicitly; on 1.21.1 they are plain
	// dependencies (MixinExtras also rides inside fabric-loader at runtime). No annotation processor:
	// Loom remaps mixins statically instead.
	compileOnly "net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7"
	runtimeOnly "net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7"
	compileOnly "io.github.llamalad7:mixinextras-fabric:0.5.5"
	compileOnly "org.jspecify:jspecify:1.0.0"

	// Sodium's settings API, for the Afterburner page in Sodium's menu (gui/SodiumSettingsPage). Not shipped or required.
	modClientCompileOnly "maven.modrinth:sodium:mc1.21.1-0.8.13-fabric"
}

tasks.withType(ProcessResources).configureEach {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// The labs and bench tools aren't ported to 1.21.1 yet: pass -Plabs to include them in the build again.
def labsEnabled = project.hasProperty('labs')

// The labs as their own jar, for test servers: build/labs/afterburner_labs-<version>.jar.
def labsJar = tasks.register('labsJar', Jar) {
	from sourceSets.labs.output
	archiveBaseName = 'afterburner_labs'
	destinationDirectory = layout.buildDirectory.dir('labs')
}
// The bench tools as their own jar, for test servers: build/bench/afterburner_bench-<version>.jar.
def benchJar = tasks.register('benchJar', Jar) {
	from sourceSets.bench.output
	archiveBaseName = 'afterburner_bench'
	destinationDirectory = layout.buildDirectory.dir('bench')
}
tasks.named('build') {
	if (labsEnabled) dependsOn labsJar, benchJar
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// The labs ride along inside the released jar, as a nested mod Fabric loads next to Afterburner.
	if (labsEnabled) {
		def labsFile = labsJar.flatMap { it.archiveFileName }
		inputs.property "labsFile", labsFile
		from(labsJar) { into 'META-INF/jars' }
		filesMatching('fabric.mod.json') {
			filter { it.replace('"accessWidener"', '"jars": [{"file": "META-INF/jars/' + labsFile.get() + '"}], "accessWidener"') }
		}
	}

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

