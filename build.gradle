plugins {
	id 'java'
	id 'eclipse'
	id 'idea'
	id 'net.minecraftforge.gradle' version '[7.0.29,8)'
}

version = mod_version
group = mod_group_id

base {
	archivesName = mod_id
}

// Mojang ships Java 25 with Minecraft 26.1+, so target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Source layout. The mod (common, client and labs code, one jar) is the main source set. The bench (the dev-only
// benchmark and check commands) is its own mod, afterburner_bench. The Fabric 26.3 tree (src/main, src/client, src/labs,
// src/bench) is left as it was; it is the source the port works from.
sourceSets {
	main {
		java.setSrcDirs(['src/forge/java'])
		resources.setSrcDirs(['src/forge/resources'])
	}
	bench {
		java.setSrcDirs(['src/forge/bench/java'])
		resources.setSrcDirs(['src/forge/bench/resources'])
	}
}

// The bench sees the mod's classes and the Minecraft classpath, and nothing else.
sourceSets.bench {
	compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
	runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
}

minecraft {
	// Applies the mod's access transformer to the game. Named directly: the default looks only in the last source set (the bench).
	accessTransformers = files('src/forge/resources/META-INF/accesstransformer.cfg')

	runs {
		configureEach {
			workingDir.convention layout.projectDirectory.dir('run')

			// Forge finds a jar's mixin configs in its manifest (MixinConfigs); the mod runs from folders here, so they're named.
			for (config in ['afterburner.mixins.json', 'afterburner.client.mixins.json', 'afterburner_labs.mixins.json']) {
				args "--mixin.config=${config}"
			}

			systemProperty 'forge.logging.console.level', 'debug'
			// Validates the event bus at runtime in development, with descriptive errors.
			systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
			// -PmixinAudit applies every mixin at startup (see Bench), to find all the failing ones in one launch.
			if (project.hasProperty('mixinAudit')) systemProperty 'afterburner.mixinAudit', 'true'
		}

		register('client')

		// The client with other mods (run-forge-compat/mods), to check Afterburner works beside them.
		register('compatClient') {
			workingDir = layout.projectDirectory.dir('run-forge-compat')
		}

		register('server') {
			args '--nogui'
		}
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	mavenCentral()
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
	annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
	// Forge ships Mixin and MixinExtras; the processor only checks the annotations.
	compileOnly annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}")
	compileOnly "org.jspecify:jspecify:1.0.0"
}

// The values expanded into mods.toml (and pack.mcmeta) in every resource set.
def modProperties = [
		minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
		forge_version          : forge_version, forge_version_range: forge_version_range,
		loader_version_range   : loader_version_range,
		mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
		mod_authors            : mod_authors, mod_description: mod_description,
]

tasks.named('processResources', ProcessResources) {
	inputs.properties modProperties

	filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
		expand modProperties
	}
}

tasks.named('processBenchResources', ProcessResources) {
	inputs.properties modProperties

	filesMatching(['META-INF/mods.toml']) {
		expand modProperties
	}
}

tasks.named('jar', Jar) {
	manifest {
		attributes([
				'Specification-Title'   : mod_id,
				'Specification-Vendor'  : mod_authors,
				'Specification-Version' : '1',
				'Implementation-Title'  : project.name,
				'Implementation-Version': mod_version,
				'Implementation-Vendor' : mod_authors,
				// Mixin reads these at runtime to find the configs in a built jar.
				'MixinConfigs'          : 'afterburner.mixins.json,afterburner.client.mixins.json,afterburner_labs.mixins.json'
		])
	}
	def licenseName = "LICENSE_${mod_id}"
	from('LICENSE') {
		rename { licenseName }
	}
}

// The bench as its own jar: build/bench/afterburner_bench-<version>.jar.
def benchJar = tasks.register('benchJar', Jar) {
	from sourceSets.bench.output
	archiveBaseName = 'afterburner_bench'
	destinationDirectory = layout.buildDirectory.dir('bench')
	manifest {
		attributes(['MixinConfigs': 'afterburner_bench.mixins.json'])
	}
}
tasks.named('build') {
	dependsOn benchJar
}

// Development runs load the bench mod from run/mods, as the Fabric dev client did.
def copyBench = tasks.register('copyBenchToRunMods', Copy) {
	dependsOn benchJar
	from benchJar.flatMap { it.archiveFile }
	into layout.projectDirectory.dir('run/mods')
}
tasks.matching { it.name == 'runClient' }.configureEach {
	dependsOn copyBench
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}
