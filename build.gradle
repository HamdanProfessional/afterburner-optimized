plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Sodium, for its settings API (below), from Modrinth's Maven.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

sourceSets {
	// Work in progress that isn't released yet: the shader pack loader, upscaling and far terrain, as a mod of its own
	// (afterburner_labs) that plugs into Afterburner. The dev client loads it; the release jar leaves it out.
	labs
	// The benchmark and check commands used while developing (afterburner_bench). Also only in the dev client.
	bench
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/afterburner.classtweaker")

	mods {
		"afterburner" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"afterburner_labs" {
			sourceSet sourceSets.labs
		}
		"afterburner_bench" {
			sourceSet sourceSets.bench
		}
	}

	runs {
		client {
			// The dev client loads the labs and the bench tools too (the labs' classpath has both).
			source sourceSets.labs
			// For benchmark runs, e.g. -PclientVmArgs="-Dafterburner.disable=true" -PclientArgs="--quickPlaySingleplayer bench"
			if (project.hasProperty('clientVmArgs')) vmArgs(*project.property('clientVmArgs').toString().split(' '))
			if (project.hasProperty('clientArgs')) programArgs(*project.property('clientArgs').toString().split(' '))
		}
	}
}

sourceSets.bench {
	compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
	runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
}

// The labs' far land check (/afterburner-farland) uses the bench's chunk loading and reports.
sourceSets.labs {
	compileClasspath += sourceSets.bench.compileClasspath + sourceSets.bench.output
	runtimeClasspath += sourceSets.bench.runtimeClasspath
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Sodium's settings API, for the Afterburner page in Sodium's menu (gui/SodiumSettingsPage). Not shipped or required.
	clientCompileOnly "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
}

tasks.withType(ProcessResources).configureEach {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The labs as their own jar, for test servers: build/labs/afterburner_labs-<version>.jar.
def labsJar = tasks.register('labsJar', Jar) {
	from sourceSets.labs.output
	archiveBaseName = 'afterburner_labs'
	destinationDirectory = layout.buildDirectory.dir('labs')
}
// The bench tools as their own jar, for test servers: build/bench/afterburner_bench-<version>.jar.
def benchJar = tasks.register('benchJar', Jar) {
	from sourceSets.bench.output
	archiveBaseName = 'afterburner_bench'
	destinationDirectory = layout.buildDirectory.dir('bench')
}
tasks.named('build') {
	dependsOn labsJar, benchJar
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
