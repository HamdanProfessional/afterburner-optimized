# Forge 26.3 needs JDK 25. The user-level ~/.gradle/gradle.properties pins JDK 17 (for a
# Forge 1.20.1 project), so override it here. Adjust the path if the JDK moves.
org.gradle.java.home=C:/Users/Hamdan/.jdks/jdk-25.0.4.1+1

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

## Environment properties

minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
forge_version=66.0.10
forge_version_range=[66,)
# The loader version range can only use the major version of Forge/FML as bounds.
loader_version_range=[66,)
# Forge 26.3 ships MixinExtras 0.5.4; this is only the annotation processor's version.
mixinextras_version=0.5.4

## Mod properties

mod_id=afterburner
mod_name=Afterburner
mod_license=MIT
mod_version=0.1.27
mod_group_id=com.afterburner
mod_authors=Hamdan
mod_description=Makes Minecraft run faster.

# Gives Forge one folder for the mod's classes and resources in development (it reads them as one module).
net.minecraftforge.gradle.merge-source-sets=true
